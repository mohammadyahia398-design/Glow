name: Apply patch

on:
  push:
    branches: [main]
    paths: ["patch.zip"]

permissions:
  contents: write
  actions: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack
        run: |
          unzip -o patch.zip
          rm patch.zip

      - name: Commit
        id: commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          if git commit -m "Apply patch"; then
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Build on the new commit
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build.yml --ref main
